<!doctype html>
<html lang="fr">
<body style="margin:0;background:#f5f7fb;padding:24px;font-family:Segoe UI,Arial,sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" style="max-width:600px;background:#ffffff;border-radius:16px;padding:32px;">
                    <tr>
                        <td>
                            <h1 style="margin:0 0 16px;font-size:24px;">Activez votre compte</h1>
                            <p style="margin:0 0 16px;line-height:1.6;">Bonjour {{ user.get_full_name|default:user.username }},</p>
                            <p style="margin:0 0 24px;line-height:1.6;">
                                Merci pour votre inscription. Cliquez sur le bouton ci-dessous pour activer votre compte.
                            </p>
                            <p style="margin:0 0 24px;">
                                <a href="{{ activation_url }}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:999px;font-weight:700;">
                                    Activer mon compte
                                </a>
                            </p>
                            <p style="margin:0;line-height:1.6;">
                                Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :
                                <br>
                                <a href="{{ activation_url }}">{{ activation_url }}</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
